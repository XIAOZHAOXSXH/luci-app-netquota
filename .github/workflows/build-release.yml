name: Build IPK and APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Validate source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release version
        id: metadata
        run: python tools/release_metadata.py
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: JavaScript syntax
        run: |
          find luci-app-netquota/htdocs netquota/files/usr/share/netquota/portal tests -name '*.js' -print0 |
            xargs -0 -n1 node --check
      - name: Check whitespace
        run: git diff --check HEAD

  build:
    name: Build ${{ matrix.format }}
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        format: [ipk, apk]
    env:
      SOURCE_DATE_EPOCH: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build IPK packages
        run: python tools/build_ipk.py
      - name: Install APK build prerequisites
        if: matrix.format == 'apk'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y zstd
      - name: Cache checksum-pinned OpenWrt host tools
        if: matrix.format == 'apk'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .build/openwrt-apk
          key: openwrt-apk-host-25.12.2-e7842c17855a7e7e
      - name: Fetch official APKv3 tool
        if: matrix.format == 'apk'
        run: python tools/fetch_apk_tool.py
      - name: Build and verify APK packages
        if: matrix.format == 'apk'
        run: |
          sudo env SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" "$(command -v python)" tools/build_apk.py --apk-tool "$APK_TOOL"
          sudo "$(command -v python)" tools/verify_apk.py --apk-tool "$APK_TOOL"
      - name: Store packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: netquota-${{ matrix.format }}
          path: dist/*.${{ matrix.format }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [check, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: netquota-*
          path: release
          merge-multiple: true
      - name: Verify complete release and generate checksums
        run: python tools/release_metadata.py --assets release
      - name: Publish packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.check.outputs.tag }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          args=(--title "NetQuota $RELEASE_TAG" --target "$GITHUB_SHA" --notes-file .github/RELEASE_NOTES.md)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false)
          else
            args+=(--verify-tag --latest)
          fi
          gh release create "$RELEASE_TAG" release/* "${args[@]}"
